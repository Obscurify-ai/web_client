# Reads attached documents in the browser: the Android app's parser (src/files.rs, copied from
# obscurify-android by scripts/vendor-docread.sh) built to wasm. Not part of the server workspace.
[package]
name = "docread"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
pdf-extract = "0.12"
calamine = "0.37"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1

[workspace]

# wasm-pack's bundled wasm-opt can't read what current rustc emits.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
