<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Obscurify API Reference</title>
  <meta name="description" content="Obscurify.ai API documentation — privacy-first AI chat platform." />
  <style>
    body { margin: 0; }
    .scalar-app {
      --scalar-color-1: #e8eaed;
      --scalar-color-2: #b0b5be;
      --scalar-color-3: #8b919a;
      --scalar-color-accent: #00d97e;
      --scalar-color-green: #00ff9d;
      --scalar-background-1: #0f1114;
      --scalar-background-2: #161920;
      --scalar-background-3: #1c2029;
      --scalar-background-accent: #0f1114;
      --scalar-border-color: #252a34;
      --scalar-sidebar-background-1: #0b0d10;
      --scalar-sidebar-border-color: #1c2029;
      --scalar-sidebar-color-1: #e8eaed;
      --scalar-sidebar-color-2: #8b919a;
      --scalar-sidebar-color-active: #00ff9d;
      --scalar-sidebar-search-background: #161920;
      --scalar-sidebar-search-border-color: #252a34;
      --scalar-sidebar-search-color: #e8eaed;
      --scalar-button-1: #00d97e;
      --scalar-button-1-color: #0f1114;
      --scalar-button-1-hover: #00ff9d;
    }
  </style>
</head>
<body>
  <script
    id="api-reference"
    data-url="/api-docs/openapi.json"
    data-configuration='{
      "theme": "none",
      "layout": "modern",
      "darkMode": true,
      "hiddenClients": [],
      "defaultHttpClient": {"targetKey": "shell", "clientKey": "curl"},
      "proxyUrl": "",
      "withDefaultFonts": false,
      "hideClientButton": true,
      "agent": {"disabled": true},
      "telemetry": false,
      "metaData": {
        "title": "Obscurify API Reference",
        "description": "Privacy-first AI chat platform API. Access frontier AI models with an anonymous account number and payments we can't link to it."
      }
    }'
  ></script>
  <!-- Self-hosted @scalar/api-reference 1.72.3. The config above keeps it from
       contacting Scalar: no request proxy (it would see API tokens), fonts,
       AI agent, hosted client or telemetry. -->
  <script src="/static/js/scalar-api-reference.js"></script>
</body>
</html>
