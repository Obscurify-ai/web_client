<section class="docs-ask" id="docs-ask" aria-label="Search the tutorials or ask a question" hidden>
    <div class="docs-ask-thread" id="docs-ask-thread" aria-live="polite"></div>
    <form class="docs-ask-form" id="docs-ask-form" autocomplete="off">
        <button type="button" id="docs-ask-clear" aria-label="Clear the conversation" hidden>Clear</button>
        <textarea id="docs-ask-input" rows="1" maxlength="2000" placeholder="Search or ask a question" aria-label="Search the tutorials or ask a question"></textarea>
        <button type="submit" id="docs-ask-send">Ask</button>
    </form>
    <ul class="docs-ask-results" id="docs-ask-results"></ul>
</section>
